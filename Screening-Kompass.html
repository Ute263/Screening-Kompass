<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Lokales Auswertungstool für den pädagogischen Screening-Baukasten Grundschule" />
    <title>Screening-Kompass</title>
    <style>:root {
  color-scheme: light;
  --navy: #0c2c55;
  --blue: #075fc7;
  --blue-dark: #064c9e;
  --teal: #168494;
  --teal-soft: #e8f7f7;
  --ink: #17263b;
  --muted: #66758b;
  --line: #d9e2ec;
  --line-strong: #c5d1df;
  --surface: #ffffff;
  --surface-soft: #f5f8fb;
  --surface-blue: #eff7ff;
  --yellow: #fff7d6;
  --yellow-line: #ead99a;
  --green: #177447;
  --green-soft: #e9f7ef;
  --red: #b63b45;
  --shadow: 0 14px 36px rgba(26, 51, 82, 0.08);
  --radius: 14px;
  font-family: Inter, Aptos, "Segoe UI", system-ui, -apple-system, sans-serif;
  font-synthesis: none;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--surface-soft);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--ink);
  background: var(--surface-soft);
  -webkit-font-smoothing: antialiased;
}

.boot-screen {
  display: grid;
  min-height: 100vh;
  padding: 32px;
  place-items: center;
  background: #f5f8fb;
}

.boot-screen > div {
  width: min(100%, 620px);
  padding: 38px;
  border: 1px solid #d9e2ec;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 14px 36px rgba(26, 51, 82, 0.08);
}

.boot-screen span {
  color: #168494;
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.12em;
}

.boot-screen h1 { margin-top: 8px; }
.boot-screen p { margin-bottom: 0; color: #66758b; }

button,
input,
textarea,
select {
  font: inherit;
}

button,
select {
  cursor: pointer;
}

button:disabled,
select:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(7, 95, 199, 0.25);
  outline-offset: 2px;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 8px;
  color: var(--navy);
  font-size: clamp(1.65rem, 2.4vw, 2.25rem);
  line-height: 1.15;
  letter-spacing: -0.03em;
}

h2 {
  margin-bottom: 12px;
  color: var(--navy);
  font-size: 1.15rem;
  line-height: 1.25;
}

h3 {
  margin-bottom: 7px;
  color: var(--navy);
  font-size: 0.92rem;
}

p {
  line-height: 1.55;
}

.icon {
  flex: 0 0 auto;
}

.app-header {
  position: sticky;
  z-index: 20;
  top: 0;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
  align-items: stretch;
  min-height: 72px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 4px 18px rgba(22, 48, 79, 0.04);
  backdrop-filter: blur(14px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  padding: 0 24px;
  border: 0;
  color: var(--navy);
  background: transparent;
  font-size: 1.08rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-mark {
  display: flex;
  align-items: end;
  gap: 3px;
  width: 27px;
  height: 25px;
  padding: 4px;
  border-radius: 7px;
  background: var(--navy);
}

.brand-mark span {
  width: 5px;
  border-radius: 3px 3px 1px 1px;
  background: #fff;
}

.brand-mark span:nth-child(1) { height: 8px; }
.brand-mark span:nth-child(2) { height: 15px; }
.brand-mark span:nth-child(3) { height: 11px; background: #82e1dd; }

.workflow-nav {
  display: flex;
  align-items: stretch;
  justify-content: center;
  min-width: 0;
}

.workflow-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 17px;
  border: 0;
  color: #5d6d82;
  background: transparent;
  font-size: 0.88rem;
  font-weight: 700;
  white-space: nowrap;
}

.workflow-link::after {
  position: absolute;
  right: 14px;
  bottom: -1px;
  left: 14px;
  height: 3px;
  border-radius: 4px 4px 0 0;
  background: transparent;
  content: "";
}

.workflow-link:hover,
.workflow-link.is-active {
  color: var(--blue);
  background: #f7fbff;
}

.workflow-link.is-active::after {
  background: var(--blue);
}

.header-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 13px;
  padding: 0 22px;
}

.save-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--green);
  font-size: 0.78rem;
  font-weight: 700;
  white-space: nowrap;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 9px 15px;
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: 0.88rem;
  font-weight: 750;
  text-align: center;
  text-decoration: none;
  transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
}

.button:not(:disabled):active {
  transform: translateY(1px);
}

.button-primary {
  border-color: var(--blue);
  color: #fff;
  background: var(--blue);
  box-shadow: 0 6px 15px rgba(7, 95, 199, 0.16);
}

.button-primary:hover { background: var(--blue-dark); }

.button-secondary {
  border-color: var(--line-strong);
  color: var(--navy);
  background: #fff;
}

.button-secondary:hover,
.button-quiet:hover { background: var(--surface-blue); border-color: #a9c5e3; }

.button-quiet {
  border-color: transparent;
  color: var(--blue);
  background: transparent;
}

.button-block { width: 100%; }

.icon-button {
  display: inline-grid;
  width: 34px;
  height: 34px;
  padding: 0;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--navy);
  background: #fff;
}

.simple-page,
.report-page {
  width: min(100%, 1380px);
  min-height: calc(100vh - 72px);
  margin: 0 auto;
  padding: 38px 34px 54px;
}

.page-heading,
.report-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}

.page-heading p,
.report-toolbar p,
.workspace-title p,
.profile-heading p {
  margin-bottom: 0;
  color: var(--muted);
}

.case-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(285px, 0.72fr);
  gap: 24px;
}

.form-surface,
.guidance-panel,
.module-group,
.selection-summary,
.transfer-copy {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.form-surface,
.guidance-panel,
.selection-summary {
  padding: 26px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}

.field > span {
  color: #33465f;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.field-wide { grid-column: 1 / -1; }

.field input,
.field textarea,
.transfer-copy textarea,
.rating-select {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
}

.field input {
  min-height: 43px;
  padding: 9px 11px;
}

.field textarea,
.transfer-copy textarea {
  padding: 11px;
  line-height: 1.5;
  resize: vertical;
}

.field input::placeholder,
.field textarea::placeholder { color: #99a5b5; }

.field input:hover,
.field textarea:hover,
.rating-select:hover { border-color: #9db3ca; }

.form-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.guidance-panel {
  align-self: start;
}

.plain-steps {
  display: grid;
  gap: 16px;
  margin: 0 0 22px;
  padding: 0;
  list-style: none;
}

.plain-steps li {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 11px;
  align-items: start;
}

.plain-steps li > span {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--teal);
  font-size: 0.77rem;
  font-weight: 800;
}

.plain-steps p { margin: 2px 0 0; color: #42546b; font-size: 0.9rem; }

.notice {
  display: flex;
  gap: 10px;
  padding: 15px;
  border: 1px solid;
  border-radius: 10px;
}

.notice p { margin: 0; font-size: 0.83rem; line-height: 1.5; }

.notice-yellow {
  border-color: var(--yellow-line);
  color: #5c4f1a;
  background: var(--yellow);
}

.notice.compact { padding: 10px 11px; }

.data-actions {
  display: grid;
  gap: 3px;
  margin-top: 17px;
}

.module-selection-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 24px;
  align-items: start;
}

.module-groups { display: grid; gap: 18px; }

.module-group { overflow: hidden; }

.section-title-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 18px 21px;
  border-bottom: 1px solid var(--line);
  background: #fbfcfe;
}

.section-title-line h2 { margin: 0; }

.section-title-line span {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
}

.module-list { display: grid; }

.module-choice {
  display: grid;
  grid-template-columns: 24px 42px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  min-height: 70px;
  padding: 13px 20px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 120ms ease;
}

.module-choice:last-child { border-bottom: 0; }
.module-choice:hover { background: #f9fbfd; }
.module-choice.is-selected { background: var(--surface-blue); }
.module-choice input { position: absolute; opacity: 0; pointer-events: none; }

.choice-check {
  display: grid;
  width: 22px;
  height: 22px;
  place-items: center;
  border: 1.5px solid var(--line-strong);
  border-radius: 6px;
  color: #fff;
  background: #fff;
}

.is-selected .choice-check { border-color: var(--blue); background: var(--blue); }

.module-code {
  display: grid;
  width: 39px;
  height: 30px;
  place-items: center;
  border-radius: 7px;
  color: var(--navy);
  background: #eaf2fa;
  font-size: 0.77rem;
  font-weight: 850;
}

.module-copy { display: grid; gap: 3px; }
.module-copy strong { color: var(--navy); font-size: 0.92rem; }
.module-copy small { color: var(--muted); font-size: 0.8rem; }
.module-count { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }

.selection-summary {
  position: sticky;
  top: 96px;
}

.summary-number {
  display: flex;
  align-items: baseline;
  gap: 9px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.summary-number strong { color: var(--blue); font-size: 1.65rem; }
.summary-number span { color: var(--muted); font-size: 0.85rem; }
.selection-summary > p { margin: 18px 0; color: var(--muted); font-size: 0.86rem; }

.materials-page { width: min(100%, 1480px); }

.material-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(150px, 0.6fr)) minmax(330px, 1.2fr);
  gap: 1px;
  margin-bottom: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--line);
  box-shadow: var(--shadow);
}

.material-summary > div {
  display: flex;
  align-items: baseline;
  gap: 9px;
  min-height: 68px;
  padding: 16px 18px;
  background: #fff;
}

.material-summary strong { color: var(--blue); font-size: 1.55rem; }
.material-summary span { color: var(--muted); font-size: 0.78rem; }
.material-summary .material-summary-actions { align-items: center; justify-content: flex-end; }

.material-groups { display: grid; gap: 20px; }

.material-group {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: var(--shadow);
}

.print-sheet-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  padding: 18px;
}

.print-sheet-choice {
  position: relative;
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) 25px;
  gap: 13px;
  align-items: center;
  min-height: 142px;
  padding: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}

.print-sheet-choice:hover { border-color: #9ebbd8; box-shadow: 0 7px 18px rgba(26, 51, 82, 0.08); }
.print-sheet-choice.is-selected { border-color: #7baddc; background: var(--surface-blue); box-shadow: inset 3px 0 var(--blue); }
.print-sheet-choice > input { position: absolute; opacity: 0; pointer-events: none; }

.sheet-preview {
  display: block;
  width: 92px;
  aspect-ratio: 210 / 297;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: #fff;
  box-shadow: 0 3px 8px rgba(26, 51, 82, 0.08);
}

.sheet-preview img { display: block; width: 100%; height: 100%; object-fit: cover; }

.sheet-copy { display: grid; gap: 7px; min-width: 0; }
.sheet-copy > strong { color: var(--navy); font-size: 0.88rem; line-height: 1.35; }
.sheet-copy > small { color: var(--muted); font-size: 0.7rem; line-height: 1.35; }

.sheet-meta { display: flex; align-items: center; gap: 8px; }
.sheet-meta strong { padding: 4px 7px; border-radius: 6px; color: var(--blue); background: #e5f1fd; font-size: 0.69rem; }
.sheet-meta small { color: var(--muted); font-size: 0.68rem; }
.print-sheet-choice > .choice-check { align-self: start; margin-top: 2px; }

.material-bottom-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.material-print-page { min-height: 100vh; padding: 28px; background: #edf1f5; }

.print-material-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 22px;
  width: min(100%, 940px);
  margin: 0 auto 24px;
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  box-shadow: var(--shadow);
}

.print-material-toolbar h1 { margin-bottom: 4px; font-size: 1.45rem; }
.print-material-toolbar p { margin: 0; color: var(--muted); font-size: 0.82rem; }
.print-material-toolbar > div:last-child { display: flex; gap: 10px; }

.print-sheet-stack { display: grid; gap: 24px; justify-content: center; }

.print-sheet-page {
  width: min(100%, 794px);
  aspect-ratio: 210 / 297;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 12px 32px rgba(18, 43, 74, 0.16);
}

.print-sheet-page img { display: block; width: 100%; height: 100%; object-fit: contain; }

.workspace {
  display: grid;
  grid-template-columns: 270px minmax(520px, 1fr) 330px;
  grid-template-rows: minmax(0, 1fr) 72px;
  min-height: calc(100vh - 72px);
  background: #fff;
}

.module-rail,
.area-rail {
  grid-row: 1;
  min-width: 0;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: #f8fafc;
}

.rail-heading,
.inspector-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 58px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--line);
}

.rail-heading strong { color: var(--navy); font-size: 0.85rem; }

.rail-group { padding: 14px 12px 4px; }

.rail-group h3 {
  margin: 0 7px 7px;
  color: #768499;
  font-size: 0.67rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.rail-module {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  min-height: 47px;
  padding: 8px 8px;
  border: 0;
  border-radius: 8px;
  color: #41536a;
  background: transparent;
  text-align: left;
}

.rail-module:hover { background: #eef3f8; }
.rail-module.is-active { color: var(--blue); background: #eaf4ff; }
.rail-module > span:first-child { font-size: 0.73rem; font-weight: 850; }
.rail-module-title { overflow: hidden; font-size: 0.78rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

.rail-status {
  display: inline-grid;
  min-width: 27px;
  height: 22px;
  padding: 0 5px;
  place-items: center;
  border-radius: 11px;
  color: #748297;
  background: #e9eef4;
  font-size: 0.64rem;
  font-weight: 800;
}

.rail-status.is-complete { color: var(--green); background: var(--green-soft); }

.workspace-main {
  grid-row: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 26px 26px 32px;
  background: #fff;
}

.workspace-title {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
}

.workspace-title h1 { font-size: 1.6rem; }
.workspace-title > span {
  flex: 0 0 auto;
  color: var(--teal);
  font-size: 0.76rem;
  font-weight: 800;
}

.observation-table,
.profile-table {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 11px;
}

.observation-head,
.observation-row {
  display: grid;
  grid-template-columns: 45px minmax(240px, 1fr) minmax(270px, 0.8fr);
  align-items: center;
}

.observation-head {
  min-height: 43px;
  padding: 0 15px;
  color: #68778b;
  background: #f5f8fb;
  font-size: 0.69rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.observation-row {
  min-height: 62px;
  padding: 10px 15px;
  border-top: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
}

.observation-row:hover { background: #fbfdff; }
.observation-row.is-active { background: var(--surface-blue); box-shadow: inset 3px 0 var(--blue); }
.observation-number { color: #7b899b; font-size: 0.76rem; font-weight: 800; }
.observation-row > strong { padding-right: 16px; color: #263850; font-size: 0.85rem; line-height: 1.4; }

.evidence-control {
  display: grid;
  grid-template-columns: repeat(6, minmax(34px, 1fr));
  gap: 5px;
}

.evidence-button {
  min-width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid #bfcbd9;
  border-radius: 7px;
  color: #526278;
  background: #fff;
  font-size: 0.75rem;
  font-weight: 850;
}

.evidence-button:hover { border-color: var(--blue); color: var(--blue); background: #f4f9ff; }
.evidence-button.is-selected { border-color: var(--blue); color: #fff; background: var(--blue); box-shadow: 0 3px 9px rgba(7, 95, 199, 0.18); }

.observation-detail {
  padding: 17px 18px 19px 61px;
  border-top: 1px solid #cfe0f1;
  border-bottom: 1px solid var(--line);
  background: #f7fbff;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 13px;
}

.inspector {
  grid-row: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 0 18px 24px;
  border-left: 1px solid var(--line);
  background: #fbfcfe;
}

.inspector-heading { margin: 0 -18px 16px; }
.inspector-heading h2 { margin: 0; font-size: 0.97rem; }

.mapping-block {
  margin-top: 15px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
}

.mapping-block h3 { margin-bottom: 5px; color: var(--blue); }
.mapping-block p { margin-bottom: 9px; color: #364a63; font-size: 0.84rem; }
.mapping-result { color: var(--muted); font-size: 0.72rem; font-weight: 700; }
.inspector > .button { margin-top: 15px; }

.code-legend {
  margin-top: 22px;
  padding-top: 17px;

function areaById(id) {
  return AREAS.find((area) => area.id === id);
}

function subareaLabel(areaId, subareaId) {
  return areaById(areaId)?.subareas.find(([id]) => id === subareaId)?.[1] || subareaId;
}

function moduleById(id) {
  return MODULES.find((module) => module.id === id);
}

function responseKey(moduleId, itemId) {
  return `${moduleId}:${itemId}`;
}

function profileKey(areaId, subareaId) {
  return `${areaId}|${subareaId}`;
}



const codeMap = new Map(EVIDENCE_CODES.map((code) => [code.value, code]));

function suggestedRating(codes) {
  const observed = codes.filter(Boolean);
  if (!observed.length) return "nb";
  const known = observed.filter((code) => code !== "?");
  if (!known.length) return "nb";
  if (known.some((code) => code === "G" || code === "N")) return "-";
  if (known.every((code) => code === "S")) return "+";
  return "o";
}

function unique(items) {
  return [...new Set(items.map((value) => value?.trim()).filter(Boolean))];
}

function buildProfile(state) {
  const groups = new Map();
  for (const module of MODULES) {
    if (!state.selectedModules.includes(module.id)) continue;
    for (const observation of module.items) {
      const response = state.responses[responseKey(module.id, observation.id)];
      if (!response?.code) continue;
      for (const mapping of observation.mappings) {
        const key = profileKey(mapping.areaId, mapping.subareaId);
        const existing = groups.get(key) || {
          key,
          areaId: mapping.areaId,
          subareaId: mapping.subareaId,
          codes: [],
          evidence: [],
          supports: [],
          contexts: [],
          sources: []
        };
        existing.codes.push(response.code);
        if (response.evidence) existing.evidence.push(response.evidence);
        if (response.support) existing.supports.push(response.support);
        if (response.context) existing.contexts.push(response.context);
        existing.sources.push(`${module.id} · ${observation.text}`);
        groups.set(key, existing);
      }
    }
  }

  return [...groups.values()]
    .map((entry) => {
      const suggestion = suggestedRating(entry.codes);
      const rating = state.manualRatings[entry.key] || suggestion;
      return {
        ...entry,
        areaLabel: areaById(entry.areaId)?.label || entry.areaId,
        subareaLabel: subareaLabel(entry.areaId, entry.subareaId),
        suggestion,
        rating,
        evidence: unique(entry.evidence),
        supports: unique(entry.supports),
        contexts: unique(entry.contexts),
        sources: unique(entry.sources),
        isPriority: state.priorities.includes(entry.key)
      };
    })
    .sort((a, b) => {
      const areaOrder = AREAS.findIndex((area) => area.id === a.areaId) - AREAS.findIndex((area) => area.id === b.areaId);
      return areaOrder || a.subareaLabel.localeCompare(b.subareaLabel, "de");
    });
}

function progressForModule(state, module) {
  const answered = module.items.filter((observation) => state.responses[responseKey(module.id, observation.id)]?.code).length;
  return { answered, total: module.items.length, complete: answered === module.items.length };
}

function progressForArea(profile, areaId) {
  const rows = profile.filter((row) => row.areaId === areaId);
  return { observed: rows.length, needs: rows.filter((row) => row.rating === "-").length };
}

function defaultReportFor(row) {
  const template = REPORT_TEMPLATES[row.key] || {
    goal: `Das Kind zeigt die nächste Kompetenz im Bereich „${row.subareaLabel}“ in vergleichbaren Situationen zunehmend selbstständig.`,
    measures: "Die wirksame Hilfe aus dem Screening wird gezielt eingesetzt, dokumentiert und schrittweise reduziert.",
    evaluation: "Die Entwicklung wird nach sechs bis acht Wochen mit einer vergleichbaren Aufgabe unter dokumentierten Bedingungen überprüft."
  };
  const evidenceText = row.evidence.length
    ? row.evidence.slice(0, 3).join(" ")
    : `Im Screening zeigte sich im Bereich „${row.subareaLabel}“ ein ${ratingDescription(row.rating)} Ergebnis.`;
  const supportText = row.supports.length ? ` Hilfreich war: ${row.supports.slice(0, 2).join("; ")}.` : "";
  const contextText = row.contexts.length ? ` Beobachtet wurde dies: ${row.contexts.slice(0, 2).join("; ")}.` : "";
  return {
    stand: `${evidenceText}${supportText}${contextText}`.trim(),
    goal: template.goal,
    measures: `${template.measures} ${template.evaluation}`.trim()
  };
}

function reportForRow(state, row) {
  return { ...defaultReportFor(row), ...(state.reportEdits[row.key] || {}) };
}

function ratingDescription(rating) {
  return APP_RATINGS.find((entry) => entry.value === rating)?.description || "noch nicht eingeordnetes";
}

function buildTransferText(state, profile) {
  const priorities = state.priorities
    .map((key) => profile.find((row) => row.key === key))
    .filter(Boolean)
    .slice(0, 3);
  const caseData = state.caseData;
  const head = [
    "SCREENING-KOMPASS · ÜBERTRAGUNG ZUM FÖRDERKOMPASS",
    `Kind / Kürzel: ${caseData.label || "—"}`,
    `Klasse / Schuljahr: ${[caseData.className, caseData.schoolYear].filter(Boolean).join(" · ") || "—"}`,
    `Zeitraum: ${caseData.period || "—"}`,
    `Fragestellung: ${caseData.question || "—"}`,
    `Stärken und Gelingensbedingungen: ${caseData.strengths || "—"}`,
    ""
  ];
  if (!priorities.length) {
    return [...head, "Noch keine Förderpriorität ausgewählt."].join("\n");
  }
  const blocks = priorities.flatMap((row, index) => {
    const report = reportForRow(state, row);
    return [
      `${index + 1}. ${row.areaLabel} · ${row.subareaLabel}`,
      `App-Einordnung: ${row.rating === "nb" ? "n. b." : row.rating}`,
      `Ist-Stand: ${report.stand}`,
      `Nächstes Ziel: ${report.goal}`,
      `Maßnahmen und Evaluation: ${report.measures}`,
      `Belege aus: ${row.sources.slice(0, 4).join("; ")}`,
      ""
    ];
  });
  return [...head, ...blocks, "Hinweis: Pädagogische Arbeitsgrundlage, keine Diagnose und keine standardisierte Testauswertung."].join("\n");
}

function mapCodeToRating(code) {
  return codeMap.get(code)?.appRating || "nb";
}


const STORAGE_KEY = "screeningKompass:case:v1";
let memoryState = null;

function createEmptyState() {
  return {
    schemaVersion: 1,
    caseData: {
      label: "",
      className: "",
      schoolYear: "",
      languages: "",
      period: "",
      question: "",
      strengths: ""
    },
    selectedModules: ["V2", "V3", "D2", "M2"],
    responses: {},
    manualRatings: {},
    priorities: [],
    reportEdits: {},
    selectedPrintSheets: [],
    printSelectionInitialized: false,
    activeProfileKey: "",
    currentModuleId: "V3",
    currentItemIndex: 0,
    savedAt: ""
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return memoryState || createEmptyState();
    const parsed = JSON.parse(raw);
    return { ...createEmptyState(), ...parsed, caseData: { ...createEmptyState().caseData, ...(parsed.caseData || {}) } };
  } catch {
    return memoryState || createEmptyState();
  }
}

function saveState(state) {
  const next = { ...state, savedAt: new Date().toISOString() };
  memoryState = next;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  } catch {
    // Manche Browser sperren lokale Speicherung bei direkt geöffneten HTML-Dateien.
    // In diesem Fall bleibt der Fall für die aktuelle Sitzung im Arbeitsspeicher.
  }
  return next;
}

function resetState() {
  memoryState = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* Sitzungsspeicher ist bereits geleert. */ }
  return createEmptyState();
}

function exportBackup(state) {
  const safeLabel = (state.caseData.label || "fall").replace(/[^a-z0-9äöüß_-]+/gi, "-").replace(/^-|-$/g, "") || "fall";
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), app: "Screening-Kompass", data: state }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `screening-kompass-${safeLabel}.json`;
  link.click();
  URL.revokeObjectURL(url);
}

async function importBackup(file) {
  const text = await file.text();
  const parsed = JSON.parse(text);
  const data = parsed.data || parsed;
  if (!data || data.schemaVersion !== 1 || typeof data.responses !== "object") {
    throw new Error("Die Sicherungsdatei gehört nicht zu dieser App-Version.");
  }
  const next = { ...createEmptyState(), ...data, caseData: { ...createEmptyState().caseData, ...(data.caseData || {}) } };
  return saveState(next);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return;
  } catch {
    const helper = document.createElement("textarea");
    helper.value = text;
    helper.setAttribute("readonly", "");
    helper.style.position = "fixed";
    helper.style.opacity = "0";
    document.body.appendChild(helper);
    helper.select();
    const copied = document.execCommand("copy");
    helper.remove();
    if (!copied) throw new Error("Kopieren nicht verfügbar");
  }
}

async function waitForPrintImages() {
  const images = [...document.querySelectorAll(".print-sheet-page img")];
  const results = await Promise.all(images.map((image) => {
    if (image.complete) return Promise.resolve(image.naturalWidth > 0);
    return new Promise((resolve) => {
      image.addEventListener("load", () => resolve(true), { once: true });
      image.addEventListener("error", () => resolve(false), { once: true });
    });
  }));
  return results.every(Boolean);
}

  const multiline = options.multiline;
  return `
    <label class="field ${options.wide ? "field-wide" : ""}">

      ${multiline
        ? `<textarea data-case-field="${name}" rows="${options.rows || 3}" placeholder="${escapeHtml(options.placeholder || "")}">${escapeHtml(value)}</textarea>`
        : `<input data-case-field="${name}" value="${escapeHtml(value)}" placeholder="${escapeHtml(options.placeholder || "")}" autocomplete="off" />`}
    </label>
  `;
}

const PRINT_KIND_ORDER = [
  "Aufgaben- und Beobachtungsbogen",
  "Lesematerial",
  "Arbeitsmaterial",
  "Ausschneidematerial",
  "Zusatzbogen",
  "Lösung und Auswertung"
];

function ensurePrintSelection() {
  const relevant = printSheetsForModules(state.selectedModules);
  const relevantIds = new Set(relevant.map((entry) => entry.id));
  let changed = false;
  if (!state.printSelectionInitialized) {
    state.selectedPrintSheets = relevant.filter((entry) => entry.recommended).map((entry) => entry.id);
    state.printSelectionInitialized = true;
    changed = true;
  } else {
    const cleaned = (state.selectedPrintSheets || []).filter((id) => relevantIds.has(id));
    if (cleaned.length !== (state.selectedPrintSheets || []).length) {
      state.selectedPrintSheets = cleaned;
      changed = true;
    }
  }
  if (changed) state = saveState(state);
  return relevant;
}

function sheetModuleLabels(entry) {
  return entry.moduleIds
    .filter((id) => state.selectedModules.includes(id))
    .map((id) => `${id} · ${moduleById(id)?.title || id}`)
    .join(" · ");
}

  return `

        if (!modules.length) return "";
        return `

            <h3>${group}</h3>
            ${modules.map((module) => {
              const progress = progressForModule(state, module);
              return `<button class="rail-module ${module.id === currentModule.id ? "is-active" : ""}" data-action="select-module" data-module="${module.id}">
                <span>${module.id}</span><span class="rail-module-title">${module.title}</span><span class="rail-status ${progress.complete ? "is-complete" : ""}">${progress.complete ? icon("check", 13) : `${progress.answered}/${progress.total}`}</span>

function evidenceButtons(moduleId, observation, currentCode) {
  return `<div class="evidence-control" role="group" aria-label="Beobachtungscode für ${escapeHtml(observation.text)}">

  </div>`;
}

function observeView() {
  const selected = MODULES.filter((module) => state.selectedModules.includes(module.id));
  if (!selected.length) {
    return `<main class="empty-state"><h1>Noch keine Module ausgewählt</h1><p>Wähle zunächst die passenden Screeningmodule aus.</p><button class="button button-primary" data-action="nav" data-view="modules">Module auswählen</button></main>`;
  }
  let currentModule = moduleById(state.currentModuleId);
  if (!currentModule || !state.selectedModules.includes(currentModule.id)) {
    currentModule = selected[0];
    state.currentModuleId = currentModule.id;
  }
  const index = Math.min(Math.max(state.currentItemIndex || 0, 0), currentModule.items.length - 1);
  const activeItem = currentModule.items[index];
  const activeKey = responseKey(currentModule.id, activeItem.id);
  const activeResponse = state.responses[activeKey] || {};
  const profile = buildProfile(state);
  const activeMappings = activeItem.mappings.map((mapping) => ({
    ...mapping,
    key: profileKey(mapping.areaId, mapping.subareaId),
    area: areaById(mapping.areaId)?.label || mapping.areaId,
    subarea: subareaLabel(mapping.areaId, mapping.subareaId),
    row: profile.find((entry) => entry.key === profileKey(mapping.areaId, mapping.subareaId))
  }));
  const moduleProgress = progressForModule(state, currentModule);
  return `
    <main class="workspace observe-workspace">
      ${moduleRail(currentModule)}
      <section class="workspace-main">
        <div class="workspace-title">
          <div><h1>${currentModule.id} · ${currentModule.title}</h1><p>${currentModule.description}</p></div>
          <span>${moduleProgress.answered} von ${moduleProgress.total} dokumentiert</span>
        </div>
        <div class="observation-table" role="table" aria-label="Beobachtungsaspekte">
          <div class="observation-head" role="row"><span>Nr.</span><span>Beobachtungsaspekt</span><span>Evidenz</span></div>
          ${currentModule.items.map((observation, itemIndex) => {
            const key = responseKey(currentModule.id, observation.id);
            const response = state.responses[key] || {};
            const active = itemIndex === index;
            return `
              <div class="observation-row ${active ? "is-active" : ""}" role="row" data-action="select-item" data-index="${itemIndex}">
                <span class="observation-number">${itemIndex + 1}</span>
                <strong>${observation.text}</strong>
                ${evidenceButtons(currentModule.id, observation, response.code)}
              </div>
              ${active ? `
                <div class="observation-detail">
                  <label class="field field-wide"><span>Konkreter Beleg</span><textarea rows="4" data-response-field="evidence" data-response-key="${activeKey}" placeholder="Was war konkret zu sehen oder zu hören?">${escapeHtml(activeResponse.evidence || "")}</textarea></label>
                  <div class="detail-grid">
                    <label class="field"><span>Hilfreiche Unterstützung</span><input data-response-field="support" data-response-key="${activeKey}" value="${escapeHtml(activeResponse.support || "")}" placeholder="z. B. visuelles Beispiel, Wahlmöglichkeit" /></label>
                    <label class="field"><span>Situation / Tagesform</span><input data-response-field="context" data-response-key="${activeKey}" value="${escapeHtml(activeResponse.context || "")}" placeholder="z. B. Einzelarbeit, ausgeruht" /></label>
                  </div>
                </div>
              ` : ""}
            `;
          }).join("")}
        </div>
      </section>
      <aside class="inspector no-print">
        <div class="inspector-heading"><h2>Zuordnung zum FörderKompass</h2>${icon("info", 18)}</div>
        <div class="notice notice-yellow compact">${icon("info", 17)}<p>Vorschlag – bitte fachlich prüfen</p></div>
        ${activeMappings.map((mapping) => `
          <section class="mapping-block">
            <h3>${mapping.area}</h3>
            <p>${mapping.subarea}</p>
            <span class="mapping-result">${activeResponse.code ? `Beobachtungscode ${activeResponse.code} → ${mapping.row?.rating === "nb" ? "n. b." : mapping.row?.rating || "offen"}` : "Noch kein Beobachtungscode"}</span>
          </section>
        `).join("")}
        <button class="button button-secondary button-block" data-action="toggle-priority" data-profile="${activeMappings[0]?.key || ""}" ${!activeResponse.code ? "disabled" : ""}>
          ${icon("star", 17)} ${activeMappings[0]?.row?.isPriority ? "Priorität entfernen" : "Als Priorität vormerken"}
        </button>
        <div class="code-legend">
          <h3>Beobachtungscode</h3>
          ${EVIDENCE_CODES.map((code) => `<p><strong>${code.short}</strong><span>${code.label}</span></p>`).join("")}
        </div>
      </aside>
      <footer class="workspace-footer no-print">
        <button class="button button-secondary" data-action="previous-item" ${index === 0 ? "disabled" : ""}>${icon("arrowLeft", 17)} Vorherige Aufgabe</button>
        <div class="progress-track" aria-label="Fortschritt"><span>${index + 1} von ${currentModule.items.length}</span><div><i style="width:${((index + 1) / currentModule.items.length) * 100}%"></i></div></div>
        <button class="button button-primary" data-action="next-item">${index === currentModule.items.length - 1 ? "Nächstes Modul" : "Nächste Aufgabe"} ${icon("arrowRight", 17)}</button>
      </footer>
    </main>
  `;
}

  return `

          <div class="profile-table">
            <div class="profile-head"><span>Förderbereich</span><span>Unterbereich</span><span>Ergebnis</span><span>Konkreter Beleg</span><span>Priorität</span></div>

                <strong>${row.subareaLabel}</strong>

              </div>
            `).join("")}
          </div>
        ` : `<div class="empty-inline"><h2>Noch keine Auswertung möglich</h2><p>Trage zunächst mindestens einen Beobachtungscode ein.</p><button class="button button-primary" data-action="nav" data-view="observe">Zur Beobachtung</button></div>`}
      </section>
      <aside class="inspector report-inspector no-print">
        <div class="inspector-heading"><h2>Förderplan-Vorschlag</h2>${icon("info", 18)}</div>
        ${active && report ? `
          <p class="active-profile-label">${active.areaLabel}<br /><strong>${active.subareaLabel}</strong></p>
          <label class="field field-wide"><span>Ist-Stand</span><textarea rows="5" data-report-field="stand" data-profile="${active.key}">${escapeHtml(report.stand)}</textarea></label>
          <label class="field field-wide"><span>Nächstes Ziel</span><textarea rows="5" data-report-field="goal" data-profile="${active.key}">${escapeHtml(report.goal)}</textarea></label>
          <label class="field field-wide"><span>Maßnahmen und Evaluation</span><textarea rows="6" data-report-field="measures" data-profile="${active.key}">${escapeHtml(report.measures)}</textarea></label>
          <div class="notice notice-yellow compact">${icon("info", 17)}<p>Keine Diagnose · Vorschlag fachlich prüfen</p></div>
          <button class="button button-secondary button-block" data-action="toggle-priority" data-profile="${active.key}">${icon("star", 17)} ${active.isPriority ? "Priorität entfernen" : "Priorität übernehmen"}</button>
          <button class="button button-primary button-block" data-action="nav" data-view="plan">${icon("doc", 17)} Bericht erstellen</button>

        <button class="button button-secondary" data-action="nav" data-view="observe">${icon("arrowLeft", 17)} Zurück zur Beobachtung</button>

        <button class="button button-primary" data-action="nav" data-view="plan">Förderplan vorbereiten ${icon("arrowRight", 17)}</button>
      </footer>
    </main>

  const transferText = buildTransferText(state, profile);
  return `
    <main class="report-page">

      </section>
      <article class="print-report">
        <header class="report-title">
          <div><span>SCREENING-KOMPASS</span><h1>Übertragung zum FörderKompass</h1></div>
          <p>Pädagogische Arbeitsgrundlage · keine Diagnose</p>
        </header>
        <section class="report-meta">
          <p><span>Kind / Kürzel</span><strong>${escapeHtml(state.caseData.label || "—")}</strong></p>
          <p><span>Klasse / Schuljahr</span><strong>${escapeHtml([state.caseData.className, state.caseData.schoolYear].filter(Boolean).join(" · ") || "—")}</strong></p>
          <p><span>Zeitraum</span><strong>${escapeHtml(state.caseData.period || "—")}</strong></p>
        </section>
        <section class="report-context"><h2>Fragestellung</h2><p>${escapeHtml(state.caseData.question || "Noch nicht eingetragen.")}</p><h2>Stärken und Gelingensbedingungen</h2><p>${escapeHtml(state.caseData.strengths || "Noch nicht eingetragen.")}</p></section>
        ${priorities.length ? priorities.map((row, index) => {
          const report = reportForRow(state, row);
          return `<section class="priority-report">
            <div class="priority-report-head"><span>Priorität ${index + 1}</span><h2>${row.areaLabel}</h2><p>${row.subareaLabel} · Einordnung ${row.rating === "nb" ? "n. b." : row.rating}</p></div>
            <div class="report-section"><h3>Ist-Stand</h3><p>${escapeHtml(report.stand)}</p></div>
            <div class="report-section"><h3>Nächstes Ziel</h3><p>${escapeHtml(report.goal)}</p></div>
            <div class="report-section"><h3>Maßnahmen und Evaluation</h3><p>${escapeHtml(report.measures)}</p></div>
            <div class="report-sources"><strong>Belege:</strong> ${escapeHtml(row.sources.slice(0, 4).join("; "))}</div>
          </section>`;
        }).join("") : `<section class="empty-report"><h2>Noch keine Priorität ausgewählt</h2><p>Gehe zurück zur Auswertung und übernimm höchstens drei belegte Schwerpunkte.</p></section>`}
        <footer class="report-note">Die Zuordnung beruht auf pädagogischen Beobachtungen und dokumentierten Hilfebedingungen. Sie ersetzt keine standardisierte, medizinische oder sonderpädagogische Diagnostik.</footer>
      </article>
      <section class="transfer-copy no-print"><h2>Textübertragung</h2><textarea readonly rows="14">${escapeHtml(transferText)}</textarea><div><button class="button button-secondary" data-action="copy-report">In Zwischenablage kopieren</button><button class="button button-quiet" data-action="export">${icon("download", 17)} Sicherung exportieren</button></div></section>
    </main>
  `;
}

function render() {
  const views = { fall: fallView, modules: modulesView, material: materialView, printmaterials: printMaterialsView, observe: observeView, evaluate: evaluateView, plan: planView };
  const content = (views[currentView] || fallView)();
  app.innerHTML = currentView === "printmaterials" ? content : `${header()}${content}`;
  document.body.dataset.view = currentView;
}

function nextObservation(direction) {
  const selected = MODULES.filter((module) => state.selectedModules.includes(module.id));
  const current = moduleById(state.currentModuleId) || selected[0];
  if (!current) return;
  let itemIndex = state.currentItemIndex || 0;
  if (direction < 0 && itemIndex > 0) itemIndex -= 1;
  if (direction > 0 && itemIndex < current.items.length - 1) itemIndex += 1;
  else if (direction > 0 && itemIndex === current.items.length - 1) {
    const moduleIndex = selected.findIndex((module) => module.id === current.id);
    const nextModule = selected[moduleIndex + 1] || selected[0];
    state.currentModuleId = nextModule.id;
    itemIndex = 0;
  }
  state.currentItemIndex = itemIndex;
  persist({ rerender: true });
}

function togglePriority(key) {
  if (!key) return;
  if (state.priorities.includes(key)) {
    state.priorities = state.priorities.filter((entry) => entry !== key);
  } else {
    if (state.priorities.length >= 3) {
      showToast("Es können höchstens drei Förderprioritäten ausgewählt werden.");
      return;
    }
    state.priorities = [...state.priorities, key];
  }
  persist({ rerender: true });
}

app.addEventListener("click", async (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;
  if (action === "nav") {
    currentView = target.dataset.view;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  if (action === "new-case") {
    if (!window.confirm("Aktuellen Fall wirklich leeren? Exportiere vorher bei Bedarf eine Sicherung.")) return;
    state = resetState();
    currentView = "fall";
    render();
  }
  if (action === "select-module") {
    state.currentModuleId = target.dataset.module;
    state.currentItemIndex = 0;
    persist({ rerender: true });
  }
  if (action === "select-item") {
    if (event.target.closest(".evidence-control")) return;
    state.currentItemIndex = Number(target.dataset.index);
    persist({ rerender: true });
  }
  if (action === "set-code") {
    event.stopPropagation();
    const key = responseKey(target.dataset.module, target.dataset.item);
    state.responses[key] = { ...(state.responses[key] || {}), code: target.dataset.code };
    const module = moduleById(target.dataset.module);
    state.currentItemIndex = module.items.findIndex((observation) => observation.id === target.dataset.item);
    persist({ rerender: true });
  }
  if (action === "previous-item") nextObservation(-1);
  if (action === "next-item") nextObservation(1);
  if (action === "filter-area") {
    areaFilter = target.dataset.area;
    render();
  }
  if (action === "select-recommended-sheets") {
    state.selectedPrintSheets = printSheetsForModules(state.selectedModules).filter((entry) => entry.recommended).map((entry) => entry.id);
    state.printSelectionInitialized = true;
    persist({ rerender: true });
  }
  if (action === "clear-print-sheets") {
    state.selectedPrintSheets = [];
    state.printSelectionInitialized = true;
    persist({ rerender: true });
  }
  if (action === "print-materials") {
    if (!(state.selectedPrintSheets || []).length) {
      showToast("Wähle zunächst mindestens eine Aufgaben- oder Materialseite aus.");
      return;
    }
    currentView = "printmaterials";
    render();
    const loaded = await waitForPrintImages();
    if (!loaded) showToast("Mindestens eine Druckseite konnte nicht geladen werden.");
    else window.print();
  }
  if (action === "print-materials-again") {
    const loaded = await waitForPrintImages();
    if (loaded) window.print();
    else showToast("Mindestens eine Druckseite konnte nicht geladen werden.");
  }
  if (action === "close-material-print") {
    currentView = "material";
    render();
  }
  if (action === "select-profile") {
    if (event.target.closest("select") || event.target.closest("button")) return;
    state.activeProfileKey = target.dataset.profile;
    persist({ rerender: true });
  }
  if (action === "toggle-priority") togglePriority(target.dataset.profile);
  if (action === "print") window.print();
  if (action === "copy-report") {
    const text = buildTransferText(state, buildProfile(state));
    try {
      await copyText(text);
      showToast("Bericht wurde in die Zwischenablage kopiert.");
    } catch {
      showToast("Kopieren ist hier nicht verfügbar. Bitte den Text im Feld markieren.");
    }
  }
  if (action === "export") {
    exportBackup(state);
    showToast("Sicherung wurde heruntergeladen.");
  }
  if (action === "open-import") document.querySelector("#backup-import")?.click();
});

app.addEventListener("input", (event) => {
  const caseField = event.target.dataset.caseField;
  if (caseField) {
    state.caseData[caseField] = event.target.value;
    persist();
  }
  const responseField = event.target.dataset.responseField;
  if (responseField) {
    const key = event.target.dataset.responseKey;
    state.responses[key] = { ...(state.responses[key] || {}), [responseField]: event.target.value };
    persist();
  }
  const reportField = event.target.dataset.reportField;
  if (reportField) {
    const key = event.target.dataset.profile;
    state.reportEdits[key] = { ...(state.reportEdits[key] || {}), [reportField]: event.target.value };
    persist();
  }
});

app.addEventListener("change", async (event) => {
  const moduleId = event.target.dataset.moduleToggle;
  if (moduleId) {
    const wasSelected = state.selectedModules.includes(moduleId);
    state.selectedModules = event.target.checked
      ? [...new Set([...state.selectedModules, moduleId])]
      : state.selectedModules.filter((id) => id !== moduleId);
    if (state.printSelectionInitialized) {
      if (event.target.checked && !wasSelected) {
        const additions = PRINT_SHEETS.filter((entry) => entry.recommended && entry.moduleIds.includes(moduleId)).map((entry) => entry.id);
        state.selectedPrintSheets = [...new Set([...(state.selectedPrintSheets || []), ...additions])];
      } else if (!event.target.checked && wasSelected) {
        const stillRelevant = new Set(printSheetsForModules(state.selectedModules).map((entry) => entry.id));
        state.selectedPrintSheets = (state.selectedPrintSheets || []).filter((id) => stillRelevant.has(id));
      }
    }
    if (!state.selectedModules.includes(state.currentModuleId)) state.currentModuleId = state.selectedModules[0] || "";
    persist({ rerender: true });
  }
  const printSheetId = event.target.dataset.printSheet;
  if (printSheetId) {
    state.selectedPrintSheets = event.target.checked
      ? [...new Set([...(state.selectedPrintSheets || []), printSheetId])]
      : (state.selectedPrintSheets || []).filter((id) => id !== printSheetId);
    state.printSelectionInitialized = true;
    persist({ rerender: true });
  }
  const profileRating = event.target.dataset.profileRating;
  if (profileRating) {
    state.manualRatings[profileRating] = event.target.value;
    state.activeProfileKey = profileRating;
    persist({ rerender: true });
  }
  if (event.target.id === "backup-import" && event.target.files?.[0]) {
    try {
      state = await importBackup(event.target.files[0]);
      currentView = "fall";
      render();
      showToast("Sicherung wurde erfolgreich geladen.");
    } catch (error) {
      showToast(error.message || "Die Sicherung konnte nicht geladen werden.");
    }
  }
});

render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
}
</script>
